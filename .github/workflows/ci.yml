name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Lint
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: vendor/bin/phpunit

  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rules and signatures match their sources
        run: |
          python3 tools/build-rules.py
          python3 tools/build-signatures.py
          git diff --exit-code -- waf/rules/default.json includes/Scanner/signatures.json
